CRATE.plain:
	Inherits: ^Crate
	ScriptTriggers:

CRATE:
	Inherits: ^Crate
	Crate:
		Duration: 6000
	GiveCashCrateAction:
		Amount: 1000
		SelectionShares: 20
		UseCashTick: true
	RevealMapCrateAction:
		SelectionShares: 1
		Sequence: reveal-map
	ExplodeCrateAction@fire:
		Weapon: Napalm.Crate
		SelectionShares: 5
	GrantExternalConditionCrateAction@cloak:
		SelectionShares: 5
		Sequence: cloak
		Condition: cloak-crate-collected
	GiveBaseBuilderCrateAction:
		SelectionShares: 0
		NoBaseSelectionShares: 50
		Units: mcv
	ExplodeCrateAction:
		Weapon: Atomic
		SelectionShares: 1
	GiveUnitCrateAction:
		Units: vice
		Owner: Creeps
		SelectionShares: 10
	LevelUpCrateAction:
		Levels: 4
		SelectionShares: 12

WCRATE:
	Inherits: ^Crate
	Tooltip:
		Name: actor-wcrate-name
	RenderSprites:
		Image: wcrate

SCRATE:
	Inherits: ^Crate
	Tooltip:
		Name: actor-scrate-name

